<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1b2838; color: #c7d5e0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; }
    h1 { color: #66c0f4; margin-bottom: 16px; }
    p { font-size: 14px; color: #8f98a0; }
    canvas { border: 2px solid #66c0f4; border-radius: 8px; margin-top: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Local Test Game</h1>
    <p>Click to change color</p>
    <canvas id="c" width="300" height="200"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let hue = 0;
    function draw() {
      ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
      ctx.fillRect(0, 0, 300, 200);
      ctx.fillStyle = '#fff';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Local Game Works!', 150, 110);
    }
    draw();
    canvas.addEventListener('click', () => { hue = (hue + 30) % 360; draw(); });
  </script>
</body>
</html>
